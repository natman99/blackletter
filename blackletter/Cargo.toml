[package]
name = "blackletter"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { workspace = true }
blackletter_types = { workspace = true, features = ["schema", "serde", "rhai"] }
blackletter_scripting = { workspace = true }
iced = {version = "0.14.0", features = ["tokio"]}
rfd = "0.17.2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1.53.1", features = ["full"] }
log.workspace = true
notify-debouncer-full = "0.7.0"
env_logger = "0.11.11"
